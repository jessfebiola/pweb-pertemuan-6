<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 4 - Dynamic Dropdown</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/latihan4.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Dynamic Drop Down List</h1>
        <p>Latihan JavaScript - Dropdown Dinamis</p>
    </header>

    <main class="container">
        <a href="index.html" class="back-link">
            &larr; Kembali ke Homepage
        </a>

        <section class="panel">
            <h2>Dynamic Drop Down List dengan JavaScript</h2>

            <div class="dropdown-container">
                <div class="form-group">
                    <label for="jenisProduk">Jenis Produk</label>
                    <select id="jenisProduk">
                        <option value="">Pilih Jenis Produk</option>
                        <option value="desktop">Desktop</option>
                        <option value="laptop">Laptop</option>
                        <option value="smartphone">Smartphone</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="merkProduk">Merk Produk</label>
                    <select id="merkProduk" disabled>
                        <option value="">Pilih Merk</option>
                    </select>
                </div>
            </div>

            <div id="hasilProduk" class="result" hidden></div>
        </section>
    </main>

    <footer class="footer">
        <p>JavaScript Practice — Latihan 4</p>
    </footer>
</body>
</html>
