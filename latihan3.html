<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 3 - Validasi Form</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/latihan3.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Registration Form</h1>
        <p>Lengkapi formulir pendaftaran dengan benar.</p>
    </header>

    <main class="container">
        <a href="index.html" class="back-link">
            &larr; Kembali ke Homepage
        </a>

        <section class="panel">
            <form id="formRegistrasi" novalidate>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama"
                           placeholder="Masukkan nama lengkap">
                    <small class="error" id="errorNama"></small>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat"
                           placeholder="Masukkan alamat">
                    <small class="error" id="errorAlamat"></small>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="text" id="email"
                           placeholder="contoh@email.com">
                    <small class="error" id="errorEmail"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                           placeholder="Minimal 8 karakter">
                    <small class="error" id="errorPassword"></small>
                </div>

                <div class="form-group">
                    <label for="matkul">Pilih Mata Kuliah</label>
                    <select id="matkul">
                        <option value="">Pilih mata kuliah</option>
                        <option value="Dasar Pemrograman">Dasar Pemrograman</option>
                        <option value="Matematika Diskrit">Matematika Diskrit</option>
                        <option value="Struktur Data">Struktur Data</option>
                        <option value="Sistem Operasi">Sistem Operasi</option>
                        <option value="Jaringan Komputer">Jaringan Komputer</option>
                    </select>
                    <small class="error" id="errorMatkul"></small>
                </div>

                <div class="form-group">
                    <label for="kampus">Nama Perguruan Tinggi</label>
                    <textarea id="kampus"
                              placeholder="Masukkan nama perguruan tinggi"
                              rows="3"></textarea>
                    <small class="error" id="errorKampus"></small>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="persetujuan">
                    <label for="persetujuan">
                        Saya menyetujui informasi yang diberikan.
                    </label>
                </div>
                <small class="error" id="errorPersetujuan"></small>

                <div class="form-actions">
                    <button type="submit">Kirim</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>

            <div id="hasilRegistrasi3" class="result" hidden></div>
        </section>
    </main>
</body>
</html>
